[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ifca-datalab-api"
version = "0.2.0"
description = "DataLab API to create environments in a K8s cluster"
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  {name = "Aida Palacio Hoz", email = "aidaph@ifca.es"}
]
maintainers = [
  {name = "Aida Palacio Hoz", email = "aidaph@ifca.es"}
]
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "kubernetes>=31",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pyyaml>=6",
]

[project.urls]
homepage = "https://github.com/IFCA-datalab/datalab-api"
bugs = "https://github.com/IFCA-datalab/datalab-api/issues"


[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["datalab_api"]

# --- Ruff --------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["datalab_api/manifests", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "ASYNC", "FAST", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # emoji icons in the catalog
    "S105",   # flags Kubernetes Secret *names* as passwords
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"datalab_api/routers/auth.py" = ["S101"]
"datalab_api/main.py" = ["S101"]
"datalab_api/k8s.py" = ["S101"]

# --- Mypy --------------------------------------------------------------------

[tool.mypy]
files = ["datalab_api"]
exclude = ["datalab_api/manifests/"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

# --- Pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=datalab_api --cov-report=term-missing"